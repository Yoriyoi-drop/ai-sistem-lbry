version: '3.8'

services:
  # Ollama Service for AI Models
  ollama:
    image: ollama/ollama:latest
    container_name: infinite-ai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./data:/root/.ollama/data
    environment:
      # Enable GPU acceleration if available
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    networks:
      - infinite-network
    # Uncomment the following for GPU support if you have NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Alternative for older Docker versions:
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

  # Optional: Ollama Web UI for easier model management
  ollama-webui:
    image: ghcr.io/ollama-webui/ollama-webui:main
    container_name: infinite-ai-ollama-webui
    restart: unless-stopped
    ports:
      - "3001:8080"
    volumes:
      - ollama_webui_data:/app/data
    depends_on:
      - ollama
    environment:
      - OLLAMA_API_BASE_URL=http://ollama:11434/api
    networks:
      - infinite-network

volumes:
  ollama_models:
  ollama_webui_data:

networks:
  infinite-network:
    driver: bridge