# Alertmanager configuration for Infinite AI Security Platform

global:
  # The smarthost and SMTP sender used for mail notifications.
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@infinite-ai-security.local'
  smtp_auth_username: 'alertmanager'
  smtp_auth_password: 'secret'

# The root route on which each incoming alert enters.
route:
  # The labels by which incoming alerts are grouped together. For example,
  # multiple alerts coming in for cluster=A and alertname=LatencyHigh would
  # be batched into a single group.
  group_by: ['alertname', 'cluster', 'service']

  # When a new group of alerts is created by an incoming alert, wait at
  # least 'group_wait' to send the initial notification.
  # This way ensures that you get multiple alerts for the same group that start
  # firing shortly after another are batched together on the first 
  # notification.
  group_wait: 30s

  # When the first notification was sent, wait 'group_interval' to send an 
  # alert back to 'group_by', or if the alert is suppressed by 'group_by'.
  group_interval: 5m

  # If an alert has successfully been sent, wait 'repeat_interval' to
  # resend them.
  repeat_interval: 3h

  # A default receiver
  receiver: default

  # All the above attributes are inherited by all child routes and can 
  # overwritten on each.
  
  routes:
    # Critical security alerts should be sent immediately
    - matchers:
        - severity="critical"
      receiver: 'security-team'
      repeat_interval: 1h
      
    # High severity threats
    - matchers:
        - severity="high"
      receiver: 'security-team'
      repeat_interval: 2h
      
    # System performance alerts
    - matchers:
        - alertname=~"InstanceDown|HighCPU|LowMemory|DiskSpaceExceeded"
      receiver: 'operations-team'
      repeat_interval: 2h

# Inhibition rules allow to mute a set of alerts given that another alert is
# firing.
# We use this to mute any warning-level notifications if the same alert is 
# already critical.
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="high"
    equal: ['alertname', 'cluster', 'service']

receivers:
- name: 'default'
  email_configs:
  - to: 'admin@infinite-ai-security.local'
    send_resolved: true

- name: 'security-team'
  email_configs:
  - to: 'security@infinite-ai-security.local'
    send_resolved: true
  slack_configs:
  - channel: '#security-alerts'
    api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    send_resolved: true
    text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

- name: 'operations-team'
  email_configs:
  - to: 'ops@infinite-ai-security.local'
    send_resolved: true
  slack_configs:
  - channel: '#ops-alerts'
    api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    send_resolved: true
    text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"