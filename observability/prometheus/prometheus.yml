# Prometheus configuration for Infinite AI Security Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files configuration
rule_files:
  - "rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configuration
scrape_configs:
  # API Gateway metrics
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'api-gateway'
          team: 'backend'
    
  # AI Hub metrics  
  - job_name: 'ai-hub'
    static_configs:
      - targets: ['localhost:8001']
        labels:
          service: 'ai-hub'
          team: 'ai'
          
  # Go Scanner metrics
  - job_name: 'scanner'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'scanner'
          team: 'security'
          
  # Rust Labyrinth metrics
  - job_name: 'labyrinth'
    static_configs:
      - targets: ['localhost:8081']
        labels:
          service: 'labyrinth'
          team: 'security'
          
  # PostgreSQL metrics
  - job_name: 'postgresql'
    static_configs:
      - targets: ['localhost:9187']
        labels:
          service: 'postgresql'
          team: 'database'
          
  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
        labels:
          service: 'redis'
          team: 'cache'
          
  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'node-exporter'
          team: 'infrastructure'
          
  # Custom application metrics
  - job_name: 'infinite-ai-security'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'infinite-ai-security'
          team: 'platform'
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s