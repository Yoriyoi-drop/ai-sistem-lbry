[package]
name = "labyrinth"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
# Pin indexmap to version compatible with Rust 1.73
indexmap = "=2.0.0"
