apiVersion: v1
kind: Namespace
metadata:
  name: infinite-ai-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: infinite-ai-security
  labels:
    app: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: infinite-ai-security/api-gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: infinite-ai-security
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-hub
  namespace: infinite-ai-security
  labels:
    app: ai-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-hub
  template:
    metadata:
      labels:
        app: ai-hub
    spec:
      containers:
      - name: ai-hub
        image: infinite-ai-security/ai-hub:latest
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: openai
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-hub-service
  namespace: infinite-ai-security
spec:
  selector:
    app: ai-hub
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-go
  namespace: infinite-ai-security
  labels:
    app: scanner-go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scanner-go
  template:
    metadata:
      labels:
        app: scanner-go
    spec:
      containers:
      - name: scanner-go
        image: infinite-ai-security/scanner-go:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: scanner-go-service
  namespace: infinite-ai-security
spec:
  selector:
    app: scanner-go
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labyrinth-rust
  namespace: infinite-ai-security
  labels:
    app: labyrinth-rust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: labyrinth-rust
  template:
    metadata:
      labels:
        app: labyrinth-rust
    spec:
      containers:
      - name: labyrinth-rust
        image: infinite-ai-security/labyrinth-rust:latest
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: labyrinth-rust-service
  namespace: infinite-ai-security
spec:
  selector:
    app: labyrinth-rust
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-service
  namespace: infinite-ai-security
  labels:
    app: subscription-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscription-service
  template:
    metadata:
      labels:
        app: subscription-service
    spec:
      containers:
      - name: subscription-service
        image: infinite-ai-security/subscription-service:latest
        ports:
        - containerPort: 8002
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secret
              key: key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: subscription-service-service
  namespace: infinite-ai-security
spec:
  selector:
    app: subscription-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8002
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-automation
  namespace: infinite-ai-security
  labels:
    app: n8n-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-automation
  template:
    metadata:
      labels:
        app: n8n-automation
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          value: "admin"
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: password
        - name: API_BASE_URL
          value: "http://api-gateway-service"
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: infinite-ai-security
spec:
  selector:
    app: n8n-automation
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: infinite-ai-security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: infinite-ai-security
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: infinite-ai-security
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP