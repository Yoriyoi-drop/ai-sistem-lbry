# Production monitoring configuration for Infinite AI Security Platform

# Prometheus configuration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway-service.infinite-ai-security:80']

      - job_name: 'ai-hub'
        static_configs:
          - targets: ['ai-hub-service.infinite-ai-security:80']

      - job_name: 'scanner-go'
        static_configs:
          - targets: ['scanner-go-service.infinite-ai-security:80']

      - job_name: 'labyrinth-rust'
        static_configs:
          - targets: ['labyrinth-rust-service.infinite-ai-security:80']

      - job_name: 'subscription-service'
        static_configs:
          - targets: ['subscription-service-service.infinite-ai-security:80']

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            target_label: __address__
            replacement: '${1}:10255'

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  rules.yml: |
    groups:
      - name: security-alerts
        rules:
          - alert: HighThreatDetectionRate
            expr: increase(threats_detected_total[5m]) > 10
            for: 1m
            labels:
              severity: critical
              team: security
            annotations:
              summary: "High threat detection rate"
              description: "Detected {{ $value }} threats in the last 5 minutes"

          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
              team: operations
            annotations:
              summary: "Service is down"
              description: "{{ $labels.instance }} is down"

          - alert: HighCPUUsage
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 2m
            labels:
              severity: warning
              team: operations
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

          - alert: HighMemoryUsage
            expr: (node_memory_MemUsed_bytes / node_memory_MemTotal_bytes) * 100 > 85
            for: 2m
            labels:
              severity: warning
              team: operations
            annotations:
              summary: "High memory usage"
              description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"