version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Uncomment if using NVIDIA GPU
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

  infinite-ai-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    image: infinite-ai-api:latest
    container_name: infinite-ai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_SECURITY_MODEL=qwen:7b-instruct
      - AI_ROLE=executor
      - AI_NAME=InfiniteAI
    depends_on:
      - ollama
    volumes:
      # Mount repo (optional, for live code updates)
      - ..:/app:ro

volumes:
  ollama_data:
    driver: local

# Notes:
# - This configuration uses Ollama to provide the AI models. Make sure to pull the required model
#   with `ollama pull qwen:7b-instruct` after starting the Ollama service.
# - The API service connects to the Ollama service via the docker network.
