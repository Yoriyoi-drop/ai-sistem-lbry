# NexaForge Alert Rules for Prometheus (L10)

groups:
  - name: nexaforge.rules
    rules:
      # API Server alerts
      - alert: APIHighErrorRate
        expr: rate(http_requests_total{status=~"5..", handler="/api/.*"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on API server"
          description: "API server has a high error rate (>5%) for the last 2 minutes"

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{handler="/api/.*"}[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on API server"
          description: "95th percentile of API requests taking more than 1 second for the last 5 minutes"

      - alert: APILowThroughput
        expr: rate(http_requests_total{handler="/api/.*"}[5m]) < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low throughput on API server"
          description: "API server throughput is below 10 requests/minute for the last 10 minutes"

      # System resource alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for the last 5 minutes"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85% for the last 5 minutes"

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is above 85% for the last 5 minutes"

      # Database alerts
      - alert: DatabaseDown
        expr: up{job=~".*postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database is down"
          description: "Database has been down for more than 1 minute"

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 0.8 * pg_settings_max_connections
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connections"
          description: "Database connections are above 80% of maximum for the last 5 minutes"

      # Agent system alerts
      - alert: AgentTaskFailureRate
        expr: rate(agent_task_failures_total[5m]) / rate(agent_tasks_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High agent task failure rate"
          description: "Agent task failure rate is above 10% for the last 3 minutes"

      - alert: AgentQueueBacklog
        expr: agent_task_queue_size > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent queue backlog"
          description: "Agent task queue has more than 100 tasks waiting for more than 5 minutes"

      # Workflow system alerts
      - alert: WorkflowFailureRate
        expr: rate(workflow_failures_total[5m]) / rate(workflow_executions_total[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High workflow failure rate"
          description: "Workflow failure rate is above 5% for the last 3 minutes"

      # Model/AI system alerts
      - alert: ModelInferenceSlow
        expr: histogram_quantile(0.95, rate(model_inference_duration_seconds_bucket[5m])) > 30.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Model inference is slow"
          description: "95th percentile of model inference taking more than 30 seconds for the last 5 minutes"

      - alert: ModelErrorRateHigh
        expr: rate(model_errors_total[5m]) / rate(model_requests_total[5m]) > 0.02
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High model error rate"
          description: "Model error rate is above 2% for the last 3 minutes"